<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QR Code Generator</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/544/544587.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>QR Code Generator</h1>

            <p class="description">
                Enter any website link and generate a downloadable QR code.
            </p>

            <div class="input-section">

                <label for="urlInput">Website URL</label>

                <input type="text" id="urlInput" placeholder="https://example.com">

                <button onclick="generateQR()">
                    Generate QR Code
                </button>

            </div>

            <div id="qrSection" class="qr-section">

                <h2>Your QR Code</h2>

                <div id="qrcode"></div>

                <button id="downloadBtn" onclick="downloadQR()">
                    Download QR Code
                </button>

            </div>

            <p id="errorMessage"></p>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
